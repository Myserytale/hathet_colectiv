name: CD — Docker Stack Build, Smoke Test & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

jobs:
  docker-e2e-delivery:
    name: Build Full-Stack Containers & Run E2E Smoke Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build & Start PostgreSQL + Java 21 Backend + React Nginx Containers
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for Backend Health Endpoint (/api/v1/health) & Frontend Nginx (:3000)
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/api/v1/health | grep -q '"status":"UP"'; then
              echo "Backend is UP!"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS -I http://localhost:3000/

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v
