# PulseVenue Full-Stack Docker Compose (PostgreSQL 16 + Java 21 Backend + React Nginx Frontend)
# Owner: Project Manager / DevOps (ISS-01)
services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsevenue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsevenue
      POSTGRES_USER: pulsevenue
      POSTGRES_PASSWORD: pulsevenue_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsevenue -d pulsevenue"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsevenue-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pulsevenue
      SPRING_DATASOURCE_USERNAME: pulsevenue
      SPRING_DATASOURCE_PASSWORD: pulsevenue_dev_pass
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsevenue-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
